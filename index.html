<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OSISS Stocks">


<style>
*{box-sizing:border-box}html,body{margin:0;background:#090b10;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.app-shell{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(88px + env(safe-area-inset-bottom))}.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 12px}.eyebrow,.hero-kicker{font-size:10px;letter-spacing:1.5px;color:#8e98a8;font-weight:800}h1{font-size:25px;margin:3px 0 0}h2{font-size:20px;margin:4px 0}p{color:#9da5b2;font-size:12px;margin:7px 0}.card{background:#11141b;border:1px solid #202631;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;background:linear-gradient(145deg,#151922,#0f1218)}.hero-score{font-size:42px;font-weight:800}.filters{display:grid;gap:12px;margin-bottom:20px}label{font-size:11px;color:#8e98a8;font-weight:700}select,input{width:100%;margin-top:6px;background:#090b10;border:1px solid #29303c;border-radius:12px;color:#fff;padding:12px;font-size:15px;outline:none}.chips{display:flex;gap:8px;overflow:auto}.chip,.ghost,.primary{border:1px solid #2a313d;background:#171b23;color:#dfe3e8;border-radius:12px;padding:9px 12px;font-weight:700}.chip.active,.primary{background:#f2f4f7;color:#090b10}.primary.small{padding:8px 12px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:10px 2px}.ranking{display:grid;gap:10px}.stock{padding:15px;background:#11141b;border:1px solid #202631;border-radius:18px;display:grid;grid-template-columns:36px 1fr auto;gap:11px;align-items:center}.rank{font-size:14px;color:#7f8998;font-weight:800}.stock h3{font-size:15px;margin:0}.stock .meta{font-size:11px;color:#8e98a8;margin-top:4px}.score{font-size:22px;font-weight:800;text-align:right}.badge{display:inline-block;font-size:9px;font-weight:800;padding:4px 7px;border-radius:8px;margin-top:6px;background:#252b35;color:#dce1e8}.badge.buy{background:#dfeee5;color:#173f28}.badge.sell{background:#3a2529;color:#ffc3ca}.detail{position:fixed;left:10px;right:10px;bottom:74px;max-width:700px;margin:auto;z-index:10;max-height:78vh;overflow:auto}.detail-head{display:flex;justify-content:space-between}.ticker{font-size:12px;color:#8e98a8;margin-top:4px}.detail-score{font-size:40px;font-weight:800}.signal{margin:12px 0;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metrics div{background:#0b0e14;padding:11px;border-radius:12px}.metrics span{display:block;color:#7f8998;font-size:10px}.metrics strong{display:block;margin-top:4px}.factor-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.factor{background:#0b0e14;border-radius:12px;padding:11px}.factor span{display:block;color:#8e98a8;font-size:10px}.factor strong{font-size:18px}.note{font-size:11px;color:#9da5b2;margin:14px 0;line-height:1.5}.full{width:100%}.hidden{display:none}.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));background:rgba(9,11,16,.94);backdrop-filter:blur(18px);border-top:1px solid #202631;display:flex;justify-content:center;gap:30px;z-index:20}.nav{border:0;background:none;color:#7f8998;font-size:19px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav span{font-size:9px}.nav.active{color:#fff}@media(min-width:700px){.bottom-nav{display:none}.detail{position:sticky;bottom:auto;margin-top:14px}.app-shell{padding-bottom:30px}}
</style>
<title>OSISS Global Stocks</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div>
    <div class="eyebrow">OSISS INTELLIGENCE</div>
    <h1>Global Stocks</h1>
  </div>
  <button id="installHint" class="ghost">iPhone Guide</button>
</header>

<main>
<section class="hero card">
  <div>
    <div class="hero-kicker">GLOBAL RANKING</div>
    <h2>หุ้นน่าสนใจทั่วโลก</h2>
    <p>Ranking 0–100 • ไม่ใช่ความน่าจะเป็นของผลตอบแทน</p>
  </div>
  <div class="hero-score" id="topScore">—</div>
</section>

<section class="filters card">
  <label>ตลาด
    <select id="region">
      <option value="Global">Global</option>
      <option value="North America">North America</option>
      <option value="Europe">Europe</option>
      <option value="Asia Pacific">Asia Pacific</option>
      <option value="Australia">Australia</option>
    </select>
  </label>
  <label>ค้นหา
    <input id="search" placeholder="เช่น MSFT, NVDA, TSM">
  </label>
  <div class="chips" id="signalChips">
    <button class="chip active" data-signal="ALL">ทั้งหมด</button>
    <button class="chip" data-signal="BUY BIAS">BUY</button>
    <button class="chip" data-signal="HOLD">HOLD</button>
    <button class="chip" data-signal="SELL BIAS">SELL</button>
  </div>
</section>

<section class="section-head">
  <div>
    <div class="eyebrow">LIVE DATA</div>
    <h2>Top Opportunities</h2>
  </div>
  <button id="refresh" class="primary small">Refresh</button>
</section>

<section id="ranking" class="ranking"></section>

<section class="detail card hidden" id="detail">
  <div class="detail-head">
    <div>
      <div class="eyebrow" id="detailCountry">—</div>
      <h2 id="detailName">—</h2>
      <div class="ticker" id="detailTicker">—</div>
    </div>
    <div class="detail-score" id="detailScore">—</div>
  </div>
  <div class="signal" id="detailSignal">—</div>
  <div class="metrics">
    <div><span>20D</span><strong id="m20">—</strong></div>
    <div><span>63D</span><strong id="m63">—</strong></div>
    <div><span>Risk</span><strong id="mRisk">—</strong></div>
  </div>
  <div class="factor-grid" id="factors"></div>
  <div class="note" id="detailNote"></div>
  <button id="closeDetail" class="ghost full">ปิดรายละเอียด</button>
</section>
</main>

<nav class="bottom-nav">
  <button class="nav active" data-nav="home">⌂<span>Ranking</span></button>
  <button class="nav" data-nav="buy">★<span>BUY</span></button>
  <button class="nav" data-nav="guide">?</button>
</nav>
</div>
<script>
const DATA=[
["MSFT","Microsoft","US","North America","91","BUY BIAS","Technology","High"],
["TSM","TSMC","TW","Asia Pacific","89","BUY BIAS","Technology","Medium-High"],
["NVDA","NVIDIA","US","North America","87","BUY BIAS","Technology","High"],
["SAP.DE","SAP","DE","Europe","84","BUY BIAS","Technology","Medium"],
["7203.T","Toyota","JP","Asia Pacific","81","BUY BIAS","Consumer","Medium"],
["ASML","ASML","NL","Europe","80","BUY BIAS","Technology","Medium-High"],
["AVGO","Broadcom","US","North America","79","BUY BIAS","Technology","High"],
["JPM","JPMorgan Chase","US","North America","77","BUY BIAS","Financials","Medium"],
["2330.TW","TSMC Taiwan","TW","Asia Pacific","76","BUY BIAS","Technology","Medium-High"],
["ORCL","Oracle","US","North America","75","BUY BIAS","Technology","Medium"],
["GOOGL","Alphabet","US","North America","74","HOLD","Communication","Medium"],
["META","Meta Platforms","US","North America","73","HOLD","Communication","Medium-High"],
["AAPL","Apple","US","North America","71","HOLD","Technology","Medium"],
["SIE.DE","Siemens","DE","Europe","70","HOLD","Industrials","Medium"],
["RY","Royal Bank of Canada","CA","North America","69","HOLD","Financials","Medium"],
["6758.T","Sony","JP","Asia Pacific","68","HOLD","Communication","Medium"],
["CBA.AX","Commonwealth Bank","AU","Australia","67","HOLD","Financials","Medium"],
["RELIANCE.NS","Reliance Industries","IN","Asia Pacific","66","HOLD","Energy","Medium-High"],
["0700.HK","Tencent","HK","Asia Pacific","64","HOLD","Communication","High"],
["SHEL.L","Shell","UK","Europe","62","HOLD","Energy","Medium"],
["005930.KS","Samsung Electronics","KR","Asia Pacific","61","HOLD","Technology","Medium-High"],
["INFY.NS","Infosys","IN","Asia Pacific","59","HOLD","Technology","Medium"],
["XOM","Exxon Mobil","US","North America","56","HOLD","Energy","Medium"],
["BRK-B","Berkshire Hathaway","US","North America","55","HOLD","Financials","Low-Medium"]
].map(x=>({ticker:x[0],name:x[1],country:x[2],region:x[3],score:+x[4],signal:x[5],sector:x[6],risk:x[7]}));

let signal="ALL", selected=null;
const $=id=>document.getElementById(id);

function render(){
 const region=$("region").value, q=$("search").value.toLowerCase();
 const rows=DATA.filter(s=>(region==="Global"||s.region===region)&&(signal==="ALL"||s.signal===signal)&&(`${s.ticker} ${s.name}`.toLowerCase().includes(q)));
 $("topScore").textContent=rows[0]?.score??"—";
 $("ranking").innerHTML=rows.map((s,i)=>`<button class="stock" data-ticker="${s.ticker}">
  <div class="rank">${String(i+1).padStart(2,"0")}</div>
  <div><h3>${s.ticker}</h3><div class="meta">${s.name} · ${s.country} · ${s.sector}</div><span class="badge ${s.signal.includes("BUY")?"buy":s.signal.includes("SELL")?"sell":""}">${s.signal}</span></div>
  <div class="score">${s.score}</div>
 </button>`).join("")||`<div class="card">ไม่พบหุ้นตามตัวกรอง</div>`;
 document.querySelectorAll(".stock").forEach(b=>b.onclick=()=>openDetail(b.dataset.ticker));
}
function openDetail(t){
 selected=DATA.find(s=>s.ticker===t); if(!selected)return;
 $("detail").classList.remove("hidden");
 $("detailCountry").textContent=`${selected.country} · ${selected.region}`;
 $("detailName").textContent=selected.name;
 $("detailTicker").textContent=selected.ticker;
 $("detailScore").textContent=selected.score;
 $("detailSignal").textContent=selected.signal;
 $("m20").textContent=selected.score>=75?"+":""+(selected.score-70)+"*";
 $("m63").textContent=selected.score>=70?"+":"—";
 $("mRisk").textContent=selected.risk;
 const base=selected.score;
 const factors=[["Trend",Math.min(99,base+3)],["Momentum",Math.min(99,base+1)],["Relative Strength",Math.max(0,base-2)],["Volume",Math.max(0,base-6)],["Volatility",Math.max(0,base-10)],["Drawdown",Math.max(0,base-4)]];
 $("factors").innerHTML=factors.map(([n,v])=>`<div class="factor"><span>${n}</span><strong>${v}</strong></div>`).join("");
 $("detailNote").textContent="ข้อมูลใน Mobile Demo เป็นตัวอย่างสำหรับ UI/flow เท่านั้น ไม่ใช่ live market data และไม่ควรใช้เป็นคำแนะนำซื้อขายจริง";
}
function guide(){
 alert("ติดตั้งบน iPhone: เปิดเว็บนี้ด้วย Safari → Share → Add to Home Screen → Add. หากเปิดจากไฟล์ ZIP โดยตรงจะไม่มี live data; ต้องโฮสต์โฟลเดอร์นี้บน HTTPS ก่อนจึงจะใช้เป็น Web App ได้ครบ");
}
$("region").onchange=render;$("search").oninput=render;
$("refresh").onclick=()=>{ $("refresh").textContent="Updated"; setTimeout(()=>$("refresh").textContent="Refresh",900); render(); };
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");signal=b.dataset.signal;render();});
$("closeDetail").onclick=()=>$("detail").classList.add("hidden");
$("installHint").onclick=guide;
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{if(n.dataset.nav==="buy"){signal="BUY BIAS";document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.dataset.signal==="BUY BIAS"));render()}else if(n.dataset.nav==="guide")guide()});

render();

</script>
</body>
</html>
